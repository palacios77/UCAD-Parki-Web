<div class="error-pagina">
  <section class="error-tarjeta">

    <div class="error-icono">
      <i class="bi bi-cloud-slash"></i>
    </div>

    <h1>Servicio no disponible</h1>

    <p>
      No fue posible verificar tu perfil o consultar la información
      necesaria para autorizar el acceso.
    </p>

    <p class="error-ayuda">
      Tu acceso no ha sido autorizado. Intenta nuevamente más tarde.
    </p>

    <button type="button" class="btn-reintentar"
            (click)="reintentar()">
      <i class="bi bi-arrow-clockwise"></i>
      Reintentar
    </button>

    <a routerLink="/login">Ir al inicio de sesión</a>

  </section>
</div>
