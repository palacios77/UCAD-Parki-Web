<div class="acceso-pagina">
  <section class="acceso-tarjeta">

    <div class="acceso-icono">
      <i class="bi bi-shield-lock"></i>
    </div>

    <h1>Acceso restringido</h1>

    <p class="acceso-mensaje">
      No tienes los permisos necesarios para acceder a esta sección
      de UCAD Parki.
    </p>

    <p class="acceso-ayuda">
      Si consideras que deberías tener acceso, contacta al administrador
      del sistema.
    </p>

    <button
      type="button"
      class="btn-volver"
      [disabled]="cargando || !rutaAutorizada"
      (click)="volverAlModulo()">

      <i class="bi bi-arrow-left"></i>

      {{ cargando ? 'Verificando sesión...' : 'Volver a mi módulo' }}
    </button>

    <a routerLink="/login" class="enlace-login">
      <i class="bi bi-box-arrow-in-right"></i>
      Ir al inicio de sesión
    </a>

  </section>
</div>
