<div class="sistema">

  <aside class="sistema-sidebar">

    <div class="sidebar-marca">

      <img
        src="/logo.jpeg"
        alt="Logo UCAD Parki">

      <div>
        <h2>UCAD Parki</h2>
        <span>{{ rolUsuario }}</span>
      </div>

    </div>


    <nav class="sidebar-menu">

      <a
        routerLink="/dashboard/vigilante"
        routerLinkActive="activo"
        [routerLinkActiveOptions]="{ exact: true }"
        class="menu-item">

        <i class="bi bi-house-fill"></i>

        <span>
          Inicio
        </span>

      </a>


      <a
        routerLink="/dashboard/vigilante/entrada"
        routerLinkActive="activo"
        class="menu-item">

        <i class="bi bi-box-arrow-in-right"></i>

        <span>
          Entrada
        </span>

      </a>


      <a
        routerLink="/dashboard/vigilante/salida"
        routerLinkActive="activo"
        class="menu-item">

        <i class="bi bi-box-arrow-right"></i>

        <span>
          Salida
        </span>

      </a>


      <a
        routerLink="/dashboard/vigilante/vehiculos"
        routerLinkActive="activo"
        class="menu-item">

        <i class="bi bi-car-front-fill"></i>

        <span>
          Vehículos
        </span>

      </a>


      <a
        routerLink="/dashboard/vigilante/historial"
        routerLinkActive="activo"
        class="menu-item">

        <i class="bi bi-clock-history"></i>

        <span>
          Historial
        </span>

      </a>

    </nav>

  </aside>


  <section class="sistema-principal">

    <header class="sistema-barra">

      <div class="barra-derecha">

        <button
          type="button"
          class="boton-notificacion">

          <i class="bi bi-bell"></i>

          <span></span>

        </button>


        <div class="usuario-barra">

          <div class="usuario-avatar">
            {{ nombreUsuario.charAt(0).toUpperCase() }}
          </div>

          <div class="usuario-datos">

            <strong>
              {{ nombreUsuario }}
            </strong>

            <small>
              {{ rolUsuario }}
            </small>

          </div>

        </div>


        <button
          type="button"
          class="boton-salir"
          (click)="cerrarSesion()">

          <i class="bi bi-box-arrow-right"></i>

          Salir

        </button>

      </div>

    </header>


    <main class="sistema-contenido">

      <router-outlet></router-outlet>

    </main>

  </section>

</div>
